name: Update Performance Plots

on:
  workflow_dispatch:
  push:
    branches:
      - visualize_results

permissions:
  contents: write

jobs:
  generate-plots:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout zingg_community_performance_reports (this repo)
      - name: Checkout reports repo
        uses: actions/checkout@v4

      # 2️⃣ Checkout zingg_performance (CSV source)
      - name: Checkout performance repo (fork, patch-2)
        uses: actions/checkout@v4
        with:
          repository: Srishti-8976/zingg_performance
          ref: patch-2
          path: zingg_performance

      # 3️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: |
          pip install pandas matplotlib

      # 5️⃣ Generate plots
      - name: Generate performance plots
        run: |
          python scripts/generate_plots.py

      # 6️⃣ Commit updated plots
      - name: Commit plots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add plots/
          if git diff --cached --quiet; then
            echo "No plot changes to commit"
          else
            git commit -m "Update performance plots [auto]"
            git push
          fi

