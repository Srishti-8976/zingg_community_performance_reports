name: Update Performance Plots

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # daily at 3 AM UTC

permissions:
  contents: write

jobs:
  generate-plots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reports repo
        uses: actions/checkout@v4

      - name: Checkout performance repo (your fork, patch-2)
        uses: actions/checkout@v4
        with:
          repository: Srishti-8976/zingg_performance
          ref: patch-2
          path: zingg_performance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas matplotlib

      - name: Generate plots
        run: |
          python scripts/generate_plots.py

      - name: Commit plots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add plots/
          git commit -m "Update performance plots [auto]" || echo "No changes"
          git push

