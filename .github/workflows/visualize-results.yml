name: Generate Benchmark Visualizations

on:
  push:
    branches:
      - visualize_results
    paths:
      - "perf_test/**/*.csv"
      - "scripts/**"

jobs:
  visualize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas matplotlib

      - name: Check generated CSV files
        run: |
          echo "Listing all CSV files:"
          find . -name "*.csv"

      - name: Generate plots
        run: python scripts/plot_results.py

      - name: Commit generated plots
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add plots/
          git commit -m "Auto-generate benchmark plots" || echo "No changes"
          git push
